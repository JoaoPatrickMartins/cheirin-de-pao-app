<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    background: #C9BBA2;
    color: #241608;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  input::placeholder { color: #B5A789; opacity: 1; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  #root { height: 100%; }
  button { font-family: inherit; }
  @keyframes rfShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @keyframes rfSpin{to{transform:rotate(360deg)}}
  @keyframes rfBlink{50%{opacity:0}}
  @keyframes crSpin{to{transform:rotate(360deg)}}@keyframes crShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}@keyframes crBlink{50%{opacity:0}}@keyframes crUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}@keyframes crPop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}@keyframes crCount{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes crScanLine{from{transform:translateY(-95px)}to{transform:translateY(95px)}}@keyframes crHalo{0%{box-shadow:0 0 0 0 rgba(62,124,83,.45)}100%{box-shadow:0 0 0 18px rgba(62,124,83,0)}}@keyframes crBeat{50%{transform:scale(1.08)}}@keyframes crSheen{0%{background-position:150% 0}55%,100%{background-position:-60% 0}}
  .cr-col>*{flex-shrink:0}.cr-map .leaflet-tile-pane{filter:sepia(.3) saturate(.75) brightness(1.03)}.cr-map .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7)}
